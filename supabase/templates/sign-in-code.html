<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your OurPawPass code</title>
  </head>
  <body style="margin:0;padding:0;background:#FFF8F1;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF8F1;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border:1px solid #EDE3D9;border-radius:24px;">
            <tr>
              <td style="padding:32px 28px 8px 28px;font-family:Arial,Helvetica,sans-serif;">
                <div style="font-size:22px;font-weight:700;color:#0E6B63;">OurPawPass</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;color:#1F1A17;">
                <div style="font-size:24px;font-weight:700;line-height:1.3;">Your sign in code</div>
                <div style="font-size:15px;line-height:1.6;color:#4A433E;margin-top:12px;">
                  Type this 6 digit code in the OurPawPass app to continue.
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 28px;">
                <div style="background:#E3F1EE;border-radius:16px;padding:20px 12px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:700;letter-spacing:10px;color:#0B5650;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 32px 28px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#6B625B;">
                The code works once and expires soon. If you did not ask for it, you can ignore this email and nothing will happen.
              </td>
            </tr>
          </table>
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6B625B;margin-top:16px;">
            OurPawPass, health and care for pets in Lagos
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
