<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add health record</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17">
<main style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 12px">
<a href="Passport.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Add a record for Bingo</h1>
</header>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="font-size: 13px; font-weight: 600; color: #4A433E; padding: 0; margin-bottom: 8px">Type</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: {{accent}}; color: #FFFFFF; font: 700 13px 'Plus Jakarta Sans', sans-serif">Vaccine</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Deworming</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Treatment</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Vet visit</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Weight</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Allergy</button>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E">Vaccine
<span style="display: flex; align-items: center; height: 52px; padding: 0 14px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; box-sizing: border-box"><input type="text" value="Rabies" style="flex: 1; border: none; outline: none; background: transparent; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B625B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></label>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E; min-width: 0">Date given<input type="text" value="5 Nov 2026" style="height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E; min-width: 0">Next due<input type="text" value="5 Nov 2027" style="height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #F3EBE2; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box"></label>
</div>
<p style="margin: -8px 0 0; font-size: 12px; color: #6B625B">Next due is set automatically. You can change it.</p>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E">Given by
<span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; box-sizing: border-box"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #CFE6E1; flex-shrink: 0"></span><input type="text" value="Paws &amp; Claws Vet Clinic" style="flex: 1; border: none; outline: none; background: transparent; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0"></span></label>
<p style="margin: -8px 0 0; font-size: 12px; color: #0B5650; font-weight: 600">This clinic is on PawPass. We'll ask them to verify the record.</p>

<button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 16px; border: 1.5px dashed #CFC3B7; background: transparent; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #4A433E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>Attach photo or document</button>

</main>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EDE3D9; padding: 14px 20px 26px; box-sizing: border-box">
<a href="Passport.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">Save record</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
