<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17">
<main style="padding: 56px 20px 96px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">

<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700">Community</h1>
<button aria-label="Search community" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1A17; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</header>

<div role="tablist" aria-label="Feed" style="display: flex; background: #F3EBE2; border-radius: 22px; padding: 4px">
<button role="tab" aria-selected="true" style="flex: 1; height: 40px; border: none; border-radius: 18px; background: #FFFFFF; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #1F1A17">For you</button>
<button role="tab" aria-selected="false" style="flex: 1; height: 40px; border: none; border-radius: 18px; background: transparent; font: 600 13px 'Plus Jakarta Sans', sans-serif; color: #6B625B">Near me</button>
<button role="tab" aria-selected="false" style="flex: 1; height: 40px; border: none; border-radius: 18px; background: transparent; font: 600 13px 'Plus Jakarta Sans', sans-serif; color: #6B625B">Lost &amp; found</button>
</div>

<a href="LostAlert.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFEBD9; text-decoration: none; color: #1F1A17">
<img src="../assets/bruno.jpg" alt="Photo of Bruno" style="width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; object-fit: cover; display: block">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; color: #9A3F0F; text-transform: uppercase; letter-spacing: 0.04em">Lost near you</span>
<span style="font-size: 14px; font-weight: 700">Bruno · brown Jack Russell</span>
<span style="font-size: 12px; color: #6B4A33">Last seen 2 hrs ago · Admiralty Way</span>
</span>
<span style="height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #6B3A16; display: flex; align-items: center">I've seen him</span>
</a>

<article style="background: #FFFFFF; border: 1px solid #EDE3D9; border-radius: 22px; overflow: hidden">
<header style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #DCE7F7; color: #23407A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">L</span>
<span style="flex: 1; display: flex; flex-direction: column"><a href="PetProfile.dc.html" style="font-weight: 700; font-size: 14px; text-decoration: none">Luna <span style="font-weight: 500; color: #6B625B">· Persian cat</span></a><span style="font-size: 12px; color: #6B625B">Kemi · Yaba · 1h</span></span>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{accent}}; background: transparent; color: {{accent}}; font: 700 12px 'Plus Jakarta Sans', sans-serif">Follow</button>
</header>
<img src="../assets/luna.jpg" alt="Photo of Luna napping" style="height: 230px; object-fit: cover; display: block">
<div style="padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 16px; font-size: 13px; font-weight: 600; color: #4A433E">
<button style="display: flex; align-items: center; gap: 6px; border: none; background: none; padding: 0; min-height: 36px; font: 600 13px 'Plus Jakarta Sans', sans-serif; color: #B4501C"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"></path></svg>248</button>
<button style="display: flex; align-items: center; gap: 6px; border: none; background: none; padding: 0; min-height: 36px; font: 600 13px 'Plus Jakarta Sans', sans-serif; color: #4A433E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>32</button>
<button style="display: flex; align-items: center; gap: 6px; border: none; background: none; padding: 0; min-height: 36px; font: 600 13px 'Plus Jakarta Sans', sans-serif; color: #4A433E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg>Share</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.45"><strong>Luna</strong> has claimed the new sofa. Grooming day tomorrow, wish her luck.</p>
</div>
</article>

<article style="background: #FFFFFF; border: 1px solid #EDE3D9; border-radius: 22px; overflow: hidden">
<header style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #F3D9C4; color: #7A3E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">R</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px">Rex &amp; Tiger <span style="font-weight: 500; color: #6B625B">· German Shepherds</span></span><span style="font-size: 12px; color: #6B625B">Chidi · Ikeja · 3h</span></span>
</header>
<img src="../assets/gsd.jpg" alt="Photo of Rex and Tiger" style="height: 200px; object-fit: cover; display: block">
</article>

</main>

<a href="CreatePost.dc.html" aria-label="New post" style="box-sizing: border-box; position: absolute; right: 20px; bottom: 100px; width: 58px; height: 58px; border-radius: 29px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(31,26,23,0.18); padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #EDE3D9; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #6B625B; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Passport.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #6B625B; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M12 16s-3.5-2.2-3.5-4.5a1.9 1.9 0 0 1 3.5-1.2 1.9 1.9 0 0 1 3.5 1.2C15.5 13.8 12 16 12 16z"></path></svg>Passport</a>
<a href="Services.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #6B625B; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Book</a>
<a href="Community.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Community</a>
<a href="Adopt.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #6B625B; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="10" r="2"></circle><circle cx="17" cy="10" r="2"></circle><circle cx="10" cy="6" r="2"></circle><circle cx="14" cy="6" r="2"></circle><path d="M12 12c-3 0-5 3.5-5 5.5S9 20 12 20s5-.5 5-2.5S15 12 12 12z"></path></svg>Adopt</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>

return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
