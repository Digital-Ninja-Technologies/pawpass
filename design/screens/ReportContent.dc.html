<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report content</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(31,26,23,0.55); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17">

<a href="PetProfile.dc.html" aria-label="Close" style="position: absolute; inset: 0 0 auto 0; height: 200px"></a>

<section role="dialog" aria-label="Report" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFF8F1; border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #DCD2C8"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Report this</h1>
<p style="margin: 0; font-size: 14px; color: #6B625B">Reports are anonymous. Our team reviews them within 24 hours.</p>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Reason</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 2px solid {{accent}}; font-size: 14px; font-weight: 600"><input type="radio" name="r" checked style="width: 18px; height: 18px; accent-color: {{accent}}; margin: 0"><span style="display: flex; flex-direction: column"><span>Scam or fake seller</span><span style="font-size: 12px; font-weight: 500; color: #6B625B">Asks to pay outside PawPass, fake photos</span></span></label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 14px; font-weight: 600"><input type="radio" name="r" style="width: 18px; height: 18px; margin: 0">Animal cruelty or neglect</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 14px; font-weight: 600"><input type="radio" name="r" style="width: 18px; height: 18px; margin: 0">Unsafe health advice</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 14px; font-weight: 600"><input type="radio" name="r" style="width: 18px; height: 18px; margin: 0">Harassment or hate</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 14px; font-weight: 600"><input type="radio" name="r" style="width: 18px; height: 18px; margin: 0">Spam or something else</label>
</fieldset>

<label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 14px; font-weight: 600">Also block this account<input type="checkbox" style="width: 20px; height: 20px; margin: 0"></label>

<p style="margin: 0; font-size: 12px; color: #8A2016; font-weight: 600">If an animal is in danger right now, also contact local authorities.</p>

<a href="Community.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">Send report</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
