<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate and review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17">
<main style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 12px">
<a href="Bookings.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">How was Mimi's groom?</h1>
</header>

<div style="display: flex; gap: 12px; align-items: center">
<img src="../assets/groomer.jpg" alt="Groomer photo" style="width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; object-fit: cover; display: block">
<span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Glam Paws Grooming</span><span style="font-size: 13px; color: #6B625B">Full groom · 3 Nov · ₦12,000</span></span>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rating, 4 of 5 stars</legend>
<div style="display: flex; justify-content: space-between">
<button aria-label="1 star" style="width: 56px; height: 56px; border: none; background: none; padding: 0; color: #E0662A"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg></button>
<button aria-label="2 stars" style="width: 56px; height: 56px; border: none; background: none; padding: 0; color: #E0662A"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg></button>
<button aria-label="3 stars" style="width: 56px; height: 56px; border: none; background: none; padding: 0; color: #E0662A"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg></button>
<button aria-label="4 stars" aria-pressed="true" style="width: 56px; height: 56px; border: none; background: none; padding: 0; color: #E0662A"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg></button>
<button aria-label="5 stars" style="width: 56px; height: 56px; border: none; background: none; padding: 0; color: #DCD2C8"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg></button>
</div>
<p style="margin: 6px 0 0; text-align: center; font-size: 14px; font-weight: 700">Great</p>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">What went well?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #E3F1EE; color: #0B5650; font: 700 13px 'Plus Jakarta Sans', sans-serif">✓ On time</button>
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #E3F1EE; color: #0B5650; font: 700 13px 'Plus Jakarta Sans', sans-serif">✓ Gentle</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Clean space</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Good value</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 13px 'Plus Jakarta Sans', sans-serif">Friendly</button>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Your review <span style="font-size: 12px; font-weight: 500; color: #6B625B">Optional · shown publicly with your first name</span>
<textarea rows="3" style="border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; padding: 12px 14px; font: 500 14px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; resize: none">Mimi came back fluffy and calm. Booking again next month.</textarea>
</label>

</main>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EDE3D9; padding: 14px 20px 26px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
<a href="Bookings.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">Confirm visit &amp; release ₦12,000</a>
<a href="OpenDispute.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; text-decoration: none; color: #A3261B">Something went wrong</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
