<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E6B63" stroke-width="1.8"><circle cx="7" cy="10" r="2"></circle><circle cx="17" cy="10" r="2"></circle><circle cx="10" cy="6" r="2"></circle><circle cx="14" cy="6" r="2"></circle><path d="M12 12c-3 0-5 3.5-5 5.5S9 20 12 20s5-.5 5-2.5S15 12 12 12z"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">PawPass</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.9">ADMIN CONSOLE</span></span>

<form style="display: flex; flex-direction: column; gap: 16px">

<span style="display: flex; align-items: center; height: 52px; padding: 0 6px 0 14px; border-radius: 14px; border: 2px solid #0E6B63; background: #FFFFFF; box-sizing: border-box"><input type="password" value="••••••••••••" autocomplete="current-password" style="flex: 1; border: none; outline: none; background: transparent; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0"><button type="button" aria-label="Show password" style="width: 40px; height: 40px; border: none; background: none; padding: 0; color: #6B625B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #4A433E"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0E6B63; margin: 0">Trust this device for 12 hours</label>
<a href="AdminOverview.dc.html" style="height: 52px; border-radius: 26px; background: #0E6B63; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Sign in</a>
</form>

<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #F3EBE2; font-size: 12px; line-height: 1.5; color: #4A433E">
