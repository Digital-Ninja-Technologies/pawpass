<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add your pet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17; display: flex; flex-direction: column">
<main style="flex: 1; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 14px">
<a href="ProfileSetup.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<div role="progressbar" aria-label="Step 5 of 6" aria-valuenow="5" aria-valuemin="1" aria-valuemax="6" style="flex: 1; height: 6px; border-radius: 3px; background: #EDE3D9; overflow: hidden"><span style="display: block; width: 83%; height: 6px; background: {{accent}}"></span></div>
</header>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700">Add your first pet</h1>
<p style="margin: 0; font-size: 15px; color: #6B625B">This creates their Pet Passport.</p>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="font-size: 13px; font-weight: 600; color: #4A433E; padding: 0; margin-bottom: 8px">Species</legend>
<div style="display: flex; gap: 8px">
<button aria-pressed="true" style="flex: 1; height: 48px; border-radius: 24px; border: none; background: {{accent}}; color: #FFFFFF; font: 700 14px 'Plus Jakarta Sans', sans-serif">Dog</button>
<button aria-pressed="false" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 14px 'Plus Jakarta Sans', sans-serif">Cat</button>
<button aria-pressed="false" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #EDE3D9; background: #FFFFFF; color: #1F1A17; font: 600 14px 'Plus Jakarta Sans', sans-serif">Other</button>
</div>
</fieldset>

<div style="display: flex; gap: 12px; align-items: flex-end">
<button aria-label="Add pet photo" style="width: 80px; height: 80px; border-radius: 22px; border: 2px dashed #CFC3B7; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #6B625B; flex-shrink: 0; padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
<label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E">Pet's name<input type="text" value="Bingo" style="height: 52px; padding: 0 14px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box"></label>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E">Breed
<span style="display: flex; align-items: center; height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; box-sizing: border-box"><input type="text" value="Boerboel" style="flex: 1; border: none; outline: none; background: transparent; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B625B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></label>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<fieldset style="border: none; margin: 0; padding: 0; min-width: 0">
<legend style="font-size: 13px; font-weight: 600; color: #4A433E; padding: 0; margin-bottom: 6px">Sex</legend>
<div style="display: flex; background: #F3EBE2; border-radius: 16px; padding: 4px; height: 52px; box-sizing: border-box">
<button aria-pressed="true" style="flex: 1; border: none; border-radius: 12px; background: #FFFFFF; font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #1F1A17">Male</button>
<button aria-pressed="false" style="flex: 1; border: none; border-radius: 12px; background: transparent; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #6B625B">Female</button>
</div>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A433E; min-width: 0">Date of birth<input type="text" value="14 Aug 2024" style="height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box"></label>
</div>
<button style="align-self: flex-start; border: none; background: none; padding: 0; min-height: 36px; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: {{accent}}">Not sure? Enter approximate age</button>

<a href="PetHealth.dc.html" style="margin-top: auto; height: 54px; border-radius: 27px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Continue</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
