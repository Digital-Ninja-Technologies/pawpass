<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adoption application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17">
<main style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 12px">
<a href="Adopt.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Apply to adopt Ada</h1>
</header>

<section style="display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EDE3D9">
<img src="../assets/ada.jpg" alt="Photo of Ada" style="width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; object-fit: cover; display: block">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Ada · mixed breed · 1 yr</span><span style="font-size: 12px; color: #6B625B">Lagos Paws Rescue · vaccinated, spayed</span></span>
</section>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Your home</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 2px solid {{accent}}; font-size: 13px; font-weight: 600"><input type="radio" name="home" checked style="width: 18px; height: 18px; accent-color: {{accent}}; margin: 0">House with compound</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EDE3D9; font-size: 13px; font-weight: 600"><input type="radio" name="home" style="width: 18px; height: 18px; margin: 0">Flat or apartment</label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; font-weight: 700">Other pets at home</p>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #E3F1EE; font-size: 13px; color: #0B5650; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"></path></svg>Bingo and Mimi, shared from their passports</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Who is home during the day?
<input type="text" value="I work from home 3 days a week" style="height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; font: 500 14px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; box-sizing: border-box"></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Why Ada?
<textarea rows="2" style="border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; padding: 12px 14px; font: 500 14px 'Plus Jakarta Sans', sans-serif; color: #1F1A17; resize: none">Bingo needs a calm companion and Ada looks perfect.</textarea></label>

<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; color: #4A433E"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: {{accent}}; margin: 0; flex-shrink: 0">I agree to a short home visit or video call with the shelter.</label>

</main>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EDE3D9; padding: 14px 20px 26px; box-sizing: border-box">
<a href="Adopt.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">Send application</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
