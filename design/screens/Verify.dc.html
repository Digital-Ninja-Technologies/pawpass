<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter verification code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F1A17; display: flex; flex-direction: column">
<main style="flex: 1; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 14px">
<a href="SignUp.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<div role="progressbar" aria-label="Step 2 of 6" aria-valuenow="2" aria-valuemin="1" aria-valuemax="6" style="flex: 1; height: 6px; border-radius: 3px; background: #EDE3D9; overflow: hidden"><span style="display: block; width: 33%; height: 6px; background: {{accent}}"></span></div>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700">Enter the code</h1>
<p style="margin: 0; font-size: 15px; color: #6B625B; line-height: 1.5">Sent to <strong style="color: #1F1A17">tolu.adeyemi@example.com</strong>. <a href="SignUp.dc.html" style="color: {{accent}}; font-weight: 700; text-decoration: none">Edit</a></p>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">6-digit code</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input aria-label="Digit 1" value="4" maxlength="1" style="height: 60px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
<input aria-label="Digit 2" value="8" maxlength="1" style="height: 60px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
<input aria-label="Digit 3" value="2" maxlength="1" style="height: 60px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
<input aria-label="Digit 4" value="1" maxlength="1" style="height: 60px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
<input aria-label="Digit 5" value="" maxlength="1" style="height: 60px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
<input aria-label="Digit 6" value="" maxlength="1" style="height: 60px; border-radius: 16px; border: 1px solid #EDE3D9; background: #FFFFFF; text-align: center; font: 700 24px 'Bricolage Grotesque', sans-serif; color: #1F1A17; min-width: 0; box-sizing: border-box">
</div>
</fieldset>

<p style="margin: 0; font-size: 14px; color: #6B625B">Check spam if it's not there. <button style="border: none; background: none; padding: 0; min-height: 44px; font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #6B625B">Resend in 0:42</button></p>
<button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #EDE3D9; background: #FFFFFF; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #1F1A17"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>Open email app</button>

<a href="AccountType.dc.html" style="margin-top: auto; height: 54px; border-radius: 27px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Verify</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B63","options":["#0E6B63","#B4501C","#3346B8","#1F1A17"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E6B63' };
}
}
</script>
</body>
</html>
